<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Check URL and Load Page</title>
</head>
<body>
  <div id="content">กำลังโหลด...</div>

  <script>
    function loadPage(url) {
      fetch(url)
        .then(response => {
          if (!response.ok) throw new Error('Network error');
          return response.text();
        })
        .then(html => {
          document.getElementById('content').innerHTML = html;
        })
        .catch(err => {
          document.getElementById('content').innerText = 'โหลดหน้าเว็บล้มเหลว';
          console.error(err);
        });
    }

    const path = window.location.pathname;

    if (path.includes('/zh/')) {
      loadPage('https://cdn.jsdelivr.net/gh/dlt007/flipmenu@latest/review_zh.html');
    // } else if (path.includes('/korean/')) {
    //   loadPage('korean.html');
    } else {
      loadPage('https://cdn.jsdelivr.net/gh/dlt007/flipmenu@latest/review_en.html');
    }
  </script>
</body>
</html>
